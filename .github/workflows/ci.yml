name: Reproduce paper

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk lmodern texlive-fonts-recommended texlive-latex-recommended texlive-latex-extra
      - uses: r-lib/actions/setup-renv@v2
      - name: Rebuild and check
        run: make check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: face-of-crime-paper
          path: ms/face_of_crime.pdf
          if-no-files-found: warn
